alerts:
  channel: console            # dry-run / local; use saved_messages após login
  critical:
    percentile: 0.03
    silent: false
  normal:
    percentile: 0.15
    silent: true
  cooldown_hours: 6
  cooldown_override_drop: 0.03
  max_per_hour: 8

sources:
  - "@promobit_hardware"

watch:
  - name: gpu-principal
    category: gpu
    models: ["RTX 5070 Ti", "RX 9070 XT"]
    max_price: 6000

storage:
  path: data/garimpo.db

logging:
  level: INFO
  format: console

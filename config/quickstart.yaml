alerts:
  channel: console
  critical:
    percentile: 0.03
    silent: false
  normal:
    percentile: 0.15
    silent: true

sources:
  - "@promobit_hardware"

watch:
  - name: gpu-principal
    category: gpu
    models: ["RTX 5070 Ti", "RX 9070 XT"]
    max_price: 6000

storage:
  path: data/garimpo.db

logging:
  level: INFO
  format: console

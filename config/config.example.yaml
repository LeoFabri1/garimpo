# Example full configuration. Copy to config.yaml and edit.
# Secrets stay in environment variables — never put tokens here.
# Validate with: garimpo doctor

telegram:
  backend: telethon           # telethon | pyrotgfork
  api_id_env: TG_API_ID
  api_hash_env: TG_API_HASH
  session: data/session.session
  # session_string_env: TG_SESSION
  device_model: "Desktop"
  system_version: "Linux 6.8"
  # app_version defaults to the installed package version; override only if needed.
  # app_version: "garimpo 0.1.0"

# Grupos/canais que VOCÊ acompanha. A conta precisa conseguir ler cada um:
# canal público resolve sozinho, grupo privado exige entrar antes. Source que
# não resolve é logada e ignorada; se nenhuma resolver, o run aborta dizendo
# o motivo. `parser` default é "generic" e serve para a maioria dos canais.
sources: []
  # - "@seu_canal_de_promocoes"
  # - id: -1001234567890      # grupo privado: use o id numérico
  #   parser: hardmob
  #   enabled: true

catalog:
  extra_paths: []

watch:
  - name: gpu-principal
    category: gpu
    models:
      - "RTX 5070 Ti"
      - "RTX 5080"
      - "RX 9070 XT"
      - "RTX 4070 Super"
      - "RX 7800 XT"
    max_price: 6000
    condition: [new]        # NOTE: not applied yet — stored on the offer, not filtered
    stores_exclude: ["marketplace_generico", "aliexpress"]

  # Notebook: o nome em `models` tem de trazer "Notebook" ou "Laptop", porque
  # é esse token que o produto exige (required_aliases em
  # catalog/categories/notebook.json). "RTX 4050" sozinho não resolve — o
  # mesmo alias pertence à placa avulsa.
  # - name: notebook-gamer
  #   category: notebook
  #   models: ["Notebook RTX 4050"]
  #   max_price: 5600
  #   silent: true    # sem histórico ainda: espere 12 amostras antes de tocar

  # Caça em que o teto É a decisão: `always_alert` alerta tudo que passar nos
  # filtros abaixo de max_price, mesmo que o percentil ache caro, e fura o
  # max_per_hour. `siren` toca também a sirene do Bark (alerts.siren) — push
  # crítico que ignora o silencioso e o Foco do iPhone e toca por 30s.
  # - name: gpu-5090
  #   category: gpu
  #   models: ["RTX 5090"]
  #   max_price: 25000
  #   silent: false
  #   always_alert: true
  #   siren: true

  # - name: cpu-x3d
  #   category: cpu
  #   models: ["Ryzen 7 7800X3D", "Ryzen 7 9800X3D"]
  #   max_price: 2800

  # RAM: catalog/categories/ram.json. Só com esta categoria no watch a triagem
  # deixa passar mensagens de memória. O pente de 16GB é o SKU Kingston exato
  # (serve para completar um par); os kits são de marca livre.
  #
  # Cuidado com o teto: ele descarta a oferta ANTES do score, então um teto
  # abaixo do mercado mata a regra inteira e o histórico nunca se forma. Os
  # números abaixo são o mercado de setembro/2026 (1x16 ~R$ 2.000, kit 2x16
  # ~R$ 4.000, kit 2x32 ~R$ 8.500) e envelhecem: DDR5 subiu 161% em 9 meses.
  #
  # `silent: true` enquanto o modelo não tiver `scoring.min_samples` amostras:
  # sem baseline o alerta é só "abaixo do teto", e apitar nisso é apitar em
  # preço normal de loja. A mensagem chega no canal de qualquer forma.
  # - name: ram-16
  #   category: ram
  #   models: ["Kingston Fury Beast 16GB DDR5 5600 CL36"]
  #   max_price: 2100
  #   silent: true
  # - name: ram-32-kit
  #   category: ram
  #   models: ["Kit DDR5 32GB (2x16GB) desktop, qualquer marca/velocidade"]
  #   max_price: 4200
  #   silent: true

scoring:
  window_days: 90
  half_life_days: 21
  min_samples: 12
  # NOTE: not applied yet — outlier exclusion is not wired into the scoring path.
  outlier_mad_threshold: 3.0

# Best for instant phone push: bot (BotFather + /start + chat_id).
# saved_messages works with zero bot setup but weaker notifications.
alerts:
  channel: bot
  bot:
    token_env: TG_BOT_TOKEN
    chat_id_env: TG_CHAT_ID
  # webhook:
  #   url_env: WEBHOOK_URL
  # Sirene para regras com `siren: true`. App Bark (iOS), key no .env.
  # siren:
  #   key_env: BARK_KEY
  #   server: https://api.day.app
  critical:
    percentile: 0.01
    silent: false
    min_store_trust: 0.9
  normal:
    percentile: 0.15
    silent: true
    quiet_hours: [23, 8]
  cooldown_hours: 6
  cooldown_override_drop: 0.03
  max_per_hour: 8


storage:
  path: data/garimpo.db
  retention_raw_days: 30

health:
  # heartbeat_url_env: HEARTBEAT_URL
  interval_minutes: 5

logging:
  level: INFO
  format: console

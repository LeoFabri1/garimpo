app = "garimpo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # Set secrets: TG_API_ID, TG_API_HASH, TG_SESSION (preferred on Fly)

[http_service]
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "garimpo_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
